# Main UI functionality tests
app-ui-test:
  type: instrumentation
  app: build-outputs/app-debug.apk
  test: build-outputs/app-debug-androidTest.apk
  test-targets:
    - class com.example.simple_agent_android.TetraAppUITest#testAppLaunch
    - class com.example.simple_agent_android.TetraAppUITest#testHomeScreenElements
    - class com.example.simple_agent_android.TetraAppUITest#testAgentInstructionInput
    - class com.example.simple_agent_android.TetraAppUITest#testSettingsNavigation
  environment-variables:
    api_key: $OPENAI_API_KEY
  device:
    - model: oriole
      version: 32
      locale: 'en'
      orientation: portrait
    - model: panther
      version: 33
      locale: 'en'
      orientation: portrait

# Agent execution tests
agent-execution-test:
  type: instrumentation
  app: build-outputs/app-debug.apk
  test: build-outputs/app-debug-androidTest.apk
  test-targets:
    - class com.example.simple_agent_android.TetraAppUITest#testAccessibilityServiceCheck
    - class com.example.simple_agent_android.TetraAppUITest#testAgentExecution
    - class com.example.simple_agent_android.TetraAppUITest#testFloatingControls
  environment-variables:
    api_key: $OPENAI_API_KEY
  device:
    - model: oriole
      version: 32
      locale: 'en'
      orientation: portrait

