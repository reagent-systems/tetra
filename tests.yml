debug-features-test:
  type: instrumentation
  app: build-outputs/app-debug.apk
  test: build-outputs/app-debug-androidTest.apk
  test-targets:
    - class com.example.simple_agent_android.TetraAppUITest#testDebugFeatures
  environment-variables:
    api_key: $OPENAI_API_KEY
  device:
    - model: panther
      version: 33
      locale: 'en'
      orientation: portrait